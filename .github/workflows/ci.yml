name: CI

on:
  push:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # check out the repo

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1

      - name: Lint
        run: nix develop --no-update-lock-file --command just check

      - name: Build
        run: nix develop --no-update-lock-file --command just build

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "dist/"

  deploy:
    if: github.ref_name == 'main'
    needs: build

    # Prevent concurrent deploys, run in order
    concurrency:
      group: deploy
      cancel-in-progress: false

    runs-on: ubuntu-latest

    permissions:
      pages: write # Deploying to GitHub Pages
      id-token: write # verify deployments

    # Recommended to deploy to this environment in docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
